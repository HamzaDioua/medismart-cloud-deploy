apiVersion: apps/v1
kind: Deployment
metadata:
  name: medismart-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: medismart-frontend
  template:
    metadata:
      labels:
        app: medismart-frontend
    spec:
      containers:
        - name: frontend
          image: medismart-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: medismart-frontend
spec:
  type: LoadBalancer
  selector:
    app: medismart-frontend
  ports:
    - port: 80
      targetPort: 80