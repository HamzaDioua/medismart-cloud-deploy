apiVersion: apps/v1
kind: Deployment
metadata:
  name: medismart-backend-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: medismart-backend
  template:
    metadata:
      labels:
        app: medismart-backend
    spec:
      containers:
        - name: medismart-backend
          image: medismart-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-configmap
            - secretRef:
                  name: backend-secret
          startupProbe:
              httpGet:
                path: /api/actuator/health/liveness
                port: 8080
              periodSeconds: 5
              failureThreshold: 18
          readinessProbe:
              httpGet:
                path: /api/actuator/health/readiness
                port: 8080
              periodSeconds: 5
              failureThreshold: 3
          livenessProbe:
              httpGet:
                path: /api/actuator/health/liveness
                port: 8080
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          resources:
              requests:
                cpu: "250m"
                memory: "512Mi"
              limits:
                cpu: "1000m"
                memory: "768Mi"
          volumeMounts:
              - name: uploads
                mountPath: /app/uploads
      volumes:
        - name: uploads
          emptyDir: {}  

---

apiVersion: v1
kind: Service
metadata:
  name: medismart-backend
spec:
  type: ClusterIP
  selector:
    app: medismart-backend
  ports:
    - port: 8080
      targetPort: 8080
