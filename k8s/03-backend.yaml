apiVersion: apps/v1
kind: Deployment
metadata:
  name: medismart-backend
  labels:
    app: medismart-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: medismart-backend
  template:
    metadata:
      labels:
        app: medismart-backend
    spec:
      containers:
        - name: backend
          image: medismart-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: backend-configmap
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          # Sondes calibrées sur le temps de boot mesuré en Phase 1 (41.6s)
          startupProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 18 # 10s + (18 * 5s) = 100s max de délai d'initialisation toléré
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads
      volumes:
        - name: uploads-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: medismart-backend
  labels:
    app: medismart-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: medismart-backend
