apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medismart-postgres-pvc
spec:
  accessModes :
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: medismart-postgres-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: medismart-postgres
  template:
    metadata:
      labels:
        app: medismart-postgres
    spec:
      containers:
        - name : postgre
          image : postgres:16
          ports: 
            - containerPort: 5432
          env:
            - name: postgre_db
              value: "medismart_db"
            - name: POSTGRES_USER
              value: "medismart"
            - name: POSTGRES_PASSWORD
              value: "medismart_password"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "medismart", "-d", "medismart_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: medismart-postgres-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: medismart-postgres
spec:
  type: ClusterIP
  selector:
    app: medismart-postgres
  ports:
    - port: 5432
      targetPort: 5432