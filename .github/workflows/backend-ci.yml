name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend-app/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

env:
  PROJECT_ID: medismart-cloud-deploy
  REGION: europe-west1
  REPOSITORY: medismart-repo
  IMAGE_NAME: medismart-backend
  WIF_PROVIDER: projects/218357944446/locations/global/workloadIdentityPools/medismart-github-pool/providers/medismart-github-provider
  WIF_SERVICE_ACCOUNT: medismart-ci@medismart-cloud-deploy.iam.gserviceaccount.com

jobs:
  build-and-push:
    name: Build & Push to Artifact Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Indispensable pour l'échange de token OIDC via WIF

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF (Keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Extract Commit SHA Tag
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-app/backend/backend
          file: ./backend-app/backend/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.SHA_SHORT }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
