apiVersion: apps/v1
kind: Deployment
metadata:
  name: medismart-frontend
  namespace: medismart
  labels:
    app: medismart-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: medismart-frontend
  template:
    metadata:
      labels:
        app: medismart-frontend
    spec:
      containers:
        - name: frontend
          image: europe-west1-docker.pkg.dev/medismart-cloud-deploy/medismart-repo/medismart-frontend:749b961
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: medismart-frontend
  namespace: medismart
spec:
  type: LoadBalancer
  selector:
    app: medismart-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
