apiVersion: v1
kind: ConfigMap
metadata:
  name: medismart-backend-config
  namespace: medismart
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  SERVER_SERVLET_CONTEXT_PATH: "/api"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://medismart-postgres:5432/medismart_db"
  SPRING_DATASOURCE_USERNAME: "medismart_user"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
