apiVersion: v1
kind: ServiceAccount
metadata:
  name: medismart-backend-sa
  namespace: medismart
  annotations:
    iam.gke.io/gcp-service-account: medismart-ci@medismart-cloud-deploy.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medismart-backend
  namespace: medismart
  labels:
    app: medismart-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: medismart-backend
  template:
    metadata:
      labels:
        app: medismart-backend
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: medismart-backend-sa
      containers:
        - name: backend
          image: europe-west1-docker.pkg.dev/medismart-cloud-deploy/medismart-repo/medismart-backend:cd0d409
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: medismart-backend-config
            - secretRef:
                name: medismart-backend-secret
          volumeMounts:
            - name: gcs-fuse-csi-ephemeral
              mountPath: /app/uploads
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          startupProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: gcs-fuse-csi-ephemeral
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: medismart-files-medismart-cloud-deploy-prod
              mountOptions: "implicit-dirs"
---
apiVersion: v1
kind: Service
metadata:
  name: medismart-backend
  namespace: medismart
spec:
  type: ClusterIP
  selector:
    app: medismart-backend
  ports:
    - port: 8080
      targetPort: 8080
      name: http
